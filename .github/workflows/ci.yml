name: Neuro-Silica CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Native + WASM + Node (${{ matrix.native_cxx }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        native_cxx: [g++, clang++]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install LLVM WebAssembly linker
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
      - name: Show toolchain
        run: |
          ${{ matrix.native_cxx }} --version
          clang++ --version
          wasm-ld --version
          node --version
      - name: Run complete test target
        run: |
          make clean
          make test CXX=${{ matrix.native_cxx }} WASM_CXX=clang++ WASM_LD=wasm-ld
          make san CXX=${{ matrix.native_cxx }}

  differential:
    name: Silica-Allah lockstep trace
    runs-on: ubuntu-latest
    steps:
      - name: Check out Neuro-Silica
        uses: actions/checkout@v4
      - name: Check out pinned Silica-Allah reference
        uses: actions/checkout@v4
        with:
          repository: ljrseals-dev/Silica-Allah
          ref: 92b4e6751111a03b83080d773ed3b1b34a208d01
          path: Silica-Allah
      - name: Run per-instruction differential state trace
        run: |
          make clean
          make differential CXX=clang++ SILICA_ALLAH_DIR=Silica-Allah
